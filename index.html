<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Přehled veřejných GitHub repozitářů akcizur" />
  <title>akcizur — repositories</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">GITHUB / AKCIZUR</p>
        <h1>Repositories</h1>
      </div>
      <div class="meta">
        <span id="count">—</span>
        <span>public repos</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Filtry">
      <input id="search" type="search" placeholder="Hledat repository…" autocomplete="off" />
      <select id="typeFilter" aria-label="Filtrovat podle typu">
        <option value="all">Všechny typy</option>
      </select>
      <select id="sort" aria-label="Řazení">
        <option value="updated">Naposledy upravené</option>
        <option value="name">Název A–Z</option>
        <option value="stars">Stars</option>
      </select>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="preview-head">Preview</th>
            <th>Name</th>
            <th>Type</th>
            <th>Repository URL</th>
            <th>Deploy / GH Pages</th>
          </tr>
        </thead>
        <tbody id="repos">
          <tr><td colspan="5" class="loading">Načítám repozitáře…</td></tr>
        </tbody>
      </table>
    </section>

    <footer>
      <span>Source: GitHub API</span>
      <span id="updated">—</span>
    </footer>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
